name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The whole solution is plain net8.0 and builds on Linux, Avalonia included, so the
      # checks run on a cheap runner. TranscribeGeek.Core carries the parts worth proving -
      # the WAV header test, the ffmpeg argument construction, the SubRip formatting and the
      # never-overwrite rule for output paths - and none of them touch Windows.
      - name: Build
        run: dotnet build TranscribeGeek.sln -c Release

      # Speaker recognition is the one part of this that is native code plus downloaded model
      # files, which is exactly the sort of thing that passes a unit test and then falls over on
      # a real machine. So CI runs it for real, on a two speaker sample, and the checks fail if
      # the models do not match their recorded checksums or the speakers come back wrong.
      - name: Fetch a two speaker sample
        run: |
          curl -sSL -o /tmp/two-speakers.wav \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/1-two-speakers-en.wav

      - name: Test
        env:
          TG_DIARISE_WAV: /tmp/two-speakers.wav
        run: dotnet run --project tests/TranscribeGeek.Tests -c Release --no-build

      # The checks above run against a build from source, where the native Whisper library sits
      # in a runtimes folder next to the assembly. The product does not ship that way: it ships
      # as one self-contained executable with the natives bundled inside it, and Whisper.net
      # cannot find them there without help. 1.0.0 and 1.0.1 both shipped able to install and
      # unable to transcribe because nothing ever ran the packaged shape.
      #
      # So the harness is published exactly the way the product is and run again. Linux rather
      # than Windows only because this job is on a Linux runner; the bundling and the lookup are
      # the same on both, and this is the step that catches it.
      - name: Test the way it is actually packaged
        run: |
          dotnet publish tests/TranscribeGeek.Tests/TranscribeGeek.Tests.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish/checks
          ./publish/checks/TranscribeGeek.Tests

      # And again with the two routes that depend on the .NET host turned off, so the one that
      # does not depend on it is exercised on every build rather than only on the machine of
      # whoever hits the problem. This is the route the product now relies on, because 1.1.1
      # relied on the host putting the library where it was expected and that turned out not to
      # be true on Windows.
      - name: Test the route that does not depend on the host
        env:
          TG_FORCE_EMBEDDED: '1'
        run: ./publish/checks/TranscribeGeek.Tests
