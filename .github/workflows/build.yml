name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The whole solution is plain net8.0 and builds on Linux, Avalonia included, so the
      # checks run on a cheap runner. TranscribeGeek.Core carries the parts worth proving -
      # the WAV header test, the ffmpeg argument construction, the SubRip formatting and the
      # never-overwrite rule for output paths - and none of them touch Windows.
      - name: Build
        run: dotnet build TranscribeGeek.sln -c Release

      # Speaker recognition is the one part of this that is native code plus downloaded model
      # files, which is exactly the sort of thing that passes a unit test and then falls over on
      # a real machine. So CI runs it for real, on a two speaker sample, and the checks fail if
      # the models do not match their recorded checksums or the speakers come back wrong.
      - name: Fetch a two speaker sample
        run: |
          curl -sSL -o /tmp/two-speakers.wav \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/1-two-speakers-en.wav

      - name: Test
        env:
          TG_DIARISE_WAV: /tmp/two-speakers.wav
        run: dotnet run --project tests/TranscribeGeek.Tests -c Release --no-build
